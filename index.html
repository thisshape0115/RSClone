<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rolling Sky - Web Port</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div style="width:64px"></div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <div id="gems"><span class="diamond"></span><span id="gemCount">0</span></div>
    <div id="lives">❤️ <span id="lifeCount">3</span></div>
  </div>
</div>
<div id="worldLabel"></div>
<div id="best"></div>
<button id="muteBtn">🔊 사운드</button>
<div id="hint">← → 이동 / 드래그 · 스페이스 · 탭 : 점프</div>
<div id="overlay">
  <h1 id="title">ROLLING SKY</h1>
  <p id="subtitle">공을 굴려 하늘길 끝까지! 좌우로 피하고, 점프로 넘어가세요.<br>Riser · Crusher · Slasher · Roller · Binary · Laser · Turbine 장애물 등장.</p>
  <div id="stats"></div>
  <button class="btn" id="startBtn">시작하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
