<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rolling Sky - Web Port</title>
<style>
  :root{
    --sky-top:#8ec9ff; --sky-bot:#e9f6ff; --accent:#ff5f6d; --panel:#0009;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%; margin:0; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; background:#000;}
  #c{position:fixed; inset:0; display:block; touch-action:none;}
  #hud{position:fixed; top:0; left:0; right:0; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.35);}
  #progressWrap{flex:1; max-width:420px; margin:0 14px; background:#ffffff40; border-radius:20px; height:14px; overflow:hidden; margin-top:6px;}
  #progressBar{height:100%; width:0%; background:linear-gradient(90deg,#ffd166,#ff5f6d); border-radius:20px; transition:width .15s;}
  #gems{font-weight:700; font-size:18px; display:flex; align-items:center; gap:6px;}
  #lives{font-weight:700; font-size:18px;}
  .diamond{width:14px;height:14px; background:#5ef1ff; transform:rotate(45deg); border-radius:2px; box-shadow:0 0 6px #5ef1ffcc;}
  #overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(#0006,#0009); color:#fff; text-align:center; z-index:10; gap:16px; padding:20px;}
  #overlay h1{font-size:38px; margin:0; letter-spacing:1px;}
  #overlay p{margin:0; opacity:.85; font-size:15px; max-width:340px;}
  .btn{background:var(--accent); color:#fff; border:none; padding:14px 34px; border-radius:30px; font-size:18px; font-weight:700;
    cursor:pointer; box-shadow:0 6px 0 #b23c46; transition:transform .05s;}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #b23c46;}
  #hint{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:#fff;
    opacity:.75; font-size:13px; z-index:5; pointer-events:none; text-shadow:0 1px 4px #0008;}
  #stats{font-size:13px; opacity:.85; margin-top:2px;}
  #best{position:fixed; top:calc(60px + env(safe-area-inset-top,0px)); right:16px; color:#fff; font-size:12px; opacity:.8; z-index:5; text-shadow:0 1px 4px #0008;}
  @media (max-width:480px){ #overlay h1{font-size:28px;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div style="width:64px"></div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
    <div id="gems"><span class="diamond"></span><span id="gemCount">0</span></div>
    <div id="lives">❤️ <span id="lifeCount">3</span></div>
  </div>
</div>
<div id="best"></div>
<div id="hint">← → 이동 · 스페이스 / 탭 : 점프</div>
<div id="overlay">
  <h1 id="title">ROLLING SKY</h1>
  <p id="subtitle">공을 굴려 하늘길 끝까지! 좌우로 피하고, 점프로 넘어가세요.</p>
  <div id="stats"></div>
  <button class="btn" id="startBtn">시작하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

// ---------- basic setup ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x445577, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-4,10,6);
scene.add(sun);

// ---------- world themes (inspired by Rolling Sky's worlds) ----------
const THEMES = [
  {sky:[0x8ec9ff,0xeaf7ff], track:0xffffff, accent:0xff8fa3},
  {sky:[0xffd08a,0xfff4e0], track:0xfff1e6, accent:0xff5f6d},
  {sky:[0xb9ffcf,0xf0fff6], track:0xf3fff6, accent:0x2ec4b6},
  {sky:[0xd9b8ff,0xf3e9ff], track:0xf7f0ff, accent:0x9b5de5},
  {sky:[0xffd6e8,0xfff0f6], track:0xfff3f8, accent:0xff477e},
];
let themeIdx = 0;

function skyColor(t, idx){
  const th = THEMES[idx % THEMES.length];
  const top = new THREE.Color(th.sky[0]);
  const bot = new THREE.Color(th.sky[1]);
  return top.lerp(bot, t);
}
scene.background = skyColor(0,0);
scene.fog = new THREE.Fog(skyColor(0.6,0).getHex(), 30, 90);

// ---------- track constants ----------
const LANE_W = 1.15;          // lateral unit (continuous movement, not fixed lanes)
const TILE_LEN = 4;           // length of one track tile along Z
const TRACK_HALF_W = 3.4;     // half width of playable track
const GROUND_Y = 0;
const BALL_R = 0.42;

// ---------- ball ----------
const ballGeo = new THREE.SphereGeometry(BALL_R, 24, 24);
const ballMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.25, metalness:0.05, emissive:0x222222});
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.castShadow = false;
scene.add(ball);

const ringGeo = new THREE.TorusGeometry(BALL_R*1.15, 0.03, 8, 24);
const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:0xffe66d}));
ring.rotation.x = Math.PI/2;
ball.add(ring);

// ---------- track tile pool ----------
const tileGeo = new THREE.BoxGeometry(TRACK_HALF_W*2, 0.4, TILE_LEN);
const gemGeo = new THREE.OctahedronGeometry(0.22, 0);
const gemMat = new THREE.MeshStandardMaterial({color:0x5ef1ff, emissive:0x1188aa, roughness:0.2, metalness:0.4});
const spikeGeo = new THREE.ConeGeometry(0.28, 0.5, 5);
const spikeMat = new THREE.MeshStandardMaterial({color:0xff4757, roughness:0.4});
const barGeo = new THREE.BoxGeometry(TRACK_HALF_W*2*0.62, 0.32, 0.32);
const barMat = new THREE.MeshStandardMaterial({color:0xffb703, roughness:0.3});
const boostGeo = new THREE.CylinderGeometry(0.5,0.5,0.06,16);
const boostMat = new THREE.MeshStandardMaterial({color:0x2ec4b6, emissive:0x0a5c53});

const world = new THREE.Group();
scene.add(world);

// tile object structure: {mesh, z, type, obstacles:[meshes], gemMeshes:[], gapMinX,gapMaxX (for wall type), removed}
let tiles = [];
let tileGenZ = 0;      // next Z (world space, negative direction of travel = increasing distance)
let nextGuaranteedSafe = 3;

function makeGroundTile(){
  const m = new THREE.Mesh(tileGeo, new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.7}));
  m.receiveShadow = false;
  return m;
}

// obstacle generators. Each returns {objects:[Object3D], kind, check(ballX,ballY,ballZLocal,jumping)->'gem'|'hit'|null, gapCheck}
function genPlain(){ return {kind:'plain', objs:[]}; }

function genGap(theme){
  // a gap across some width you must jump over; represented visually by darker strip (no obstacle mesh, handled via width test)
  const gapCenter = (Math.random()*2-1)*TRACK_HALF_W*0.5;
  const gapWidth = 1.4 + Math.random()*0.8;
  const marker = new THREE.Mesh(new THREE.PlaneGeometry(gapWidth, TILE_LEN*0.9),
     new THREE.MeshBasicMaterial({color:0x223344, transparent:true, opacity:0.85}));
  marker.rotation.x = -Math.PI/2;
  marker.position.set(gapCenter, -0.05, 0);
  return {kind:'gap', objs:[marker], gapCenter, gapWidth};
}

function genSpikes(theme){
  const objs = [];
  const count = 1 + Math.floor(Math.random()*3);
  const positions = [];
  for(let i=0;i<count;i++){
    let x;
    let tries=0;
    do { x = (Math.random()*2-1)*(TRACK_HALF_W-0.6); tries++; } while(positions.some(p=>Math.abs(p-x)<0.7) && tries<10);
    positions.push(x);
    const s = new THREE.Mesh(spikeGeo, spikeMat);
    s.position.set(x, 0.45, (Math.random()-0.5)*TILE_LEN*0.4);
    s.rotation.y = Math.random()*Math.PI;
    objs.push(s);
  }
  return {kind:'spikes', objs, positions};
}

function genBar(theme){
  // a rotating bar you must jump over
  const bar = new THREE.Mesh(barGeo, barMat);
  bar.position.set(0, 0.55, 0);
  const pivot = new THREE.Group();
  pivot.add(bar);
  bar.position.y = 0.35;
  return {kind:'bar', objs:[pivot], bar, spinSpeed: 1.6+Math.random()*1.2, baseY:0.42};
}

function genWall(theme){
  // wall spanning width with a gap you must dodge into (left/mid/right)
  const gapCenter = (Math.random()<0.5? -1:1) * (0.9+Math.random()*0.9) * (Math.random()<0.7?1:0);
  const gapW = 1.3;
  const wallH = 1.1;
  const totalW = TRACK_HALF_W*2;
  const leftW = (totalW/2 + gapCenter) - gapW/2;
  const rightW = totalW - leftW - gapW;
  const objs = [];
  if(leftW>0.15){
    const wl = new THREE.Mesh(new THREE.BoxGeometry(leftW, wallH, 0.3), barMat);
    wl.position.set(-totalW/2 + leftW/2, wallH/2+0.2, 0);
    objs.push(wl);
  }
  if(rightW>0.15){
    const wr = new THREE.Mesh(new THREE.BoxGeometry(rightW, wallH, 0.3), barMat);
    wr.position.set(totalW/2 - rightW/2, wallH/2+0.2, 0);
    objs.push(wr);
  }
  return {kind:'wall', objs, gapCenter, gapW};
}

function genBoost(theme){
  const pad = new THREE.Mesh(boostGeo, boostMat);
  pad.position.set((Math.random()*2-1)*TRACK_HALF_W*0.5, 0.23, 0);
  return {kind:'boost', objs:[pad]};
}

const GEN_TABLE = [genPlain, genPlain, genGap, genSpikes, genBar, genWall, genBoost];

function spawnGems(tileGroup, avoidX, avoidRadius){
  const gems = [];
  if(Math.random()<0.55){
    const count = 1+Math.floor(Math.random()*4);
    const lineX = (Math.random()*2-1)*TRACK_HALF_W*0.55;
    for(let i=0;i<count;i++){
      if(avoidX!==undefined && Math.abs(lineX-avoidX)<avoidRadius) continue;
      const g = new THREE.Mesh(gemGeo, gemMat);
      g.position.set(lineX, 0.55, -TILE_LEN*0.35 + i*(TILE_LEN*0.7/Math.max(1,count-1||1)));
      g.userData.spin = true;
      tileGroup.add(g);
      gems.push(g);
    }
  }
  return gems;
}

function addTile(index){
  const z = -index*TILE_LEN;
  const group = new THREE.Group();
  group.position.z = z;
  const ground = makeGroundTile();
  ground.material.color.setHex(THEMES[Math.floor(index/12)%THEMES.length].track);
  group.add(ground);

  let gen;
  if(index < nextGuaranteedSafe){ gen = genPlain(); }
  else {
    const fn = GEN_TABLE[Math.floor(Math.random()*GEN_TABLE.length)];
    gen = fn(themeIdx);
  }
  gen.objs.forEach(o=>group.add(o));

  let avoidX, avoidR;
  if(gen.kind==='gap'){ avoidX = gen.gapCenter; avoidR = gen.gapWidth*0.7; }
  if(gen.kind==='wall'){ avoidX = gen.gapCenter; avoidR = gen.gapW*0.6; }
  const gems = spawnGems(group, avoidX, avoidR);

  world.add(group);
  tiles.push({group, z, index, gen, gems, passed:false});
}

function clearTrack(){
  tiles.forEach(t=>world.remove(t.group));
  tiles = [];
}

function ensureTiles(currentIndex){
  const target = currentIndex + 10;
  while(tiles.length===0 || tiles[tiles.length-1].index < target){
    addTile(tiles.length);
  }
  while(tiles.length && tiles[0].index < currentIndex-3){
    world.remove(tiles[0].group);
    tiles.shift();
  }
}

// ---------- game state ----------
let state = 'menu'; // menu, playing, dead
let ballX = 0, ballVX = 0;
let ballY = BALL_R, ballVY = 0, jumping = false;
let distance = 0;         // in tile units (float)
let speed = 6.0;          // world units / sec
const BASE_SPEED = 6.0;
let boostTimer = 0;
let lives = 3;
let gems = 0;
let checkpointDist = 0;
let checkpointGems = 0;
let invuln = 0;
let best = 0;

try{ best = parseFloat(localStorage.getItem('rs_best')||'0')||0; }catch(e){ best = 0; }
document.getElementById('best').textContent = best>0 ? ('BEST ' + Math.floor(best) + 'm') : '';

const GRAVITY = -22;
const JUMP_V = 8.6;

// input
let moveDir = 0; // -1,0,1 from keys held
let touchStartX = null;
const keys = {};
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code==='Space'){ tryJump(); }
});
addEventListener('keyup', e=>{ keys[e.code]=false; });

function tryJump(){
  if(state!=='playing') return;
  if(!jumping){ ballVY = JUMP_V; jumping = true; }
}

canvas.addEventListener('pointerdown', e=>{
  if(state!=='playing') return;
  touchStartX = e.clientX;
  tryJump();
});
canvas.addEventListener('pointermove', e=>{
  if(state!=='playing' || touchStartX===null) return;
  const dx = e.clientX - touchStartX;
  moveDir = Math.max(-1, Math.min(1, dx/60));
});
canvas.addEventListener('pointerup', ()=>{ touchStartX=null; moveDir=0; });
canvas.addEventListener('pointercancel', ()=>{ touchStartX=null; moveDir=0; });

function updateKeyMove(){
  let d = 0;
  if(keys['ArrowLeft']||keys['KeyA']) d -= 1;
  if(keys['ArrowRight']||keys['KeyD']) d += 1;
  if(d!==0) moveDir = d;
  else if(touchStartX===null) moveDir *= 0.8;
}

// ---------- HUD ----------
const gemCountEl = document.getElementById('gemCount');
const lifeCountEl = document.getElementById('lifeCount');
const progressBar = document.getElementById('progressBar');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const statsEl = document.getElementById('stats');
const startBtn = document.getElementById('startBtn');

const TOTAL_GOAL = 400; // meters-ish for progress bar loop (visual only, game is endless)

function updateHud(){
  gemCountEl.textContent = gems;
  lifeCountEl.textContent = lives;
  const pct = Math.min(100, (distance % TOTAL_GOAL)/TOTAL_GOAL*100);
  progressBar.style.width = pct+'%';
}

function resetRun(fromCheckpoint){
  ballX = 0; ballVX = 0; ballY = BALL_R; ballVY = 0; jumping = false;
  speed = BASE_SPEED; boostTimer = 0; invuln = 1.2;
  if(fromCheckpoint){
    distance = checkpointDist;
    gems = checkpointGems;
  } else {
    distance = 0; gems = 0; lives = 3; checkpointDist = 0; checkpointGems = 0;
  }
  clearTrack();
  const startIndex = Math.max(0, Math.floor(distance/TILE_LEN) - 2);
  nextGuaranteedSafe = startIndex + 3;
  for(let i=startIndex;i<startIndex+12;i++) addTile(i);
  updateHud();
}

function gameOver(){
  state = 'dead';
  if(distance > best){ best = distance; try{ localStorage.setItem('rs_best', String(best)); }catch(e){} }
  document.getElementById('best').textContent = best>0 ? ('BEST ' + Math.floor(best) + 'm') : '';
  titleEl.textContent = lives>0 ? '체크포인트에서 재시작' : 'GAME OVER';
  subtitleEl.textContent = '거리 ' + Math.floor(distance) + 'm · 젬 ' + gems + '개';
  statsEl.textContent = lives>0 ? ('남은 목숨: ' + lives) : '';
  startBtn.textContent = lives>0 ? '계속하기' : '다시 시작';
  overlay.style.display = 'flex';
}

startBtn.addEventListener('click', ()=>{
  overlay.style.display = 'none';
  if(state==='menu' || lives<=0){
    resetRun(false);
  } else {
    resetRun(true);
  }
  state = 'playing';
});

// ---------- collision helpers ----------
function currentTileFor(zDist){
  const idx = Math.floor(zDist/TILE_LEN);
  return tiles.find(t=>t.index===idx);
}

function handleCollisions(dt){
  const tile = currentTileFor(distance);
  if(!tile){ return; }
  const localZ = -(distance - tile.index*TILE_LEN - TILE_LEN/2); // relative to tile center, matches obstacle placement
  const gen = tile.gen;

  // gap: if not jumping/airborne over the gap zone, fall
  if(gen.kind==='gap'){
    const inGapX = Math.abs(ballX - gen.gapCenter) < gen.gapWidth/2;
    if(inGapX && ballY <= BALL_R+0.02 && !jumping){
      triggerFall();
      return;
    }
  }
  if(gen.kind==='wall'){
    const inGapX = Math.abs(ballX - gen.gapCenter) < gen.gapW/2 - BALL_R*0.6;
    if(!inGapX && invuln<=0){
      triggerHit();
      return;
    }
  }
  if(gen.kind==='spikes' && invuln<=0 && ballY < 0.75){
    for(const p of gen.positions){
      if(Math.abs(ballX-p) < BALL_R+0.32){ triggerHit(); return; }
    }
  }
  if(gen.kind==='bar'){
    gen._t = (gen._t||0) + dt*gen.spinSpeed;
    gen.bar.position.y = gen.baseY + Math.sin(gen._t)*0.28;
    gen.objs[0].rotation.z = Math.sin(gen._t*0.6)*0.15;
    const barY = gen.bar.position.y + gen.baseY*0; // world-ish approx
    if(invuln<=0 && Math.abs((tile.group.position.y+gen.bar.position.y) - ballY) < 0.35){
      triggerHit();
      return;
    }
  }
  if(gen.kind==='boost' && gen.objs[0] && !gen.used){
    const p = gen.objs[0];
    if(Math.abs(ballX-p.position.x) < 0.55 && ballY<0.5){
      gen.used = true;
      boostTimer = 1.4;
      p.visible = false;
    }
  }

  // gems
  if(tile.gems && tile.gems.length){
    for(const g of tile.gems){
      if(!g.visible) continue;
      const gx = g.position.x, gz = tile.z + g.position.z;
      const dz = Math.abs(-distance - (-(-gz))); // simplified below
      const worldGZ = -gz; // group already offset; g.position.z already local -> world z = tile.z + local
    }
  }
  if(tile.gems){
    for(const g of tile.gems){
      if(!g.visible) continue;
      const worldZ = tile.z + g.position.z;
      const dz = worldZ - (-distance);
      if(Math.abs(dz) < 0.4 && Math.abs(ballX-g.position.x) < 0.4 && Math.abs(ballY-g.position.y) < 0.5){
        g.visible = false;
        gems++;
      }
    }
  }

  // checkpoint every ~40m
  const cpEvery = 40;
  if(distance - checkpointDist > cpEvery){
    checkpointDist = Math.floor(distance/cpEvery)*cpEvery;
    checkpointGems = gems;
  }
}

function triggerFall(){
  state = 'falling';
  lives--;
  ballVY = -2;
  setTimeout(()=>{ if(lives>0){ gameOver(); } else { gameOver(); } }, 500);
}
function triggerHit(){
  if(invuln>0) return;
  state = 'falling';
  lives--;
  setTimeout(()=>{ gameOver(); }, 350);
}

// ---------- camera ----------
const camOffset = new THREE.Vector3(0, 3.4, 6.2);

function updateCamera(dt){
  const targetPos = new THREE.Vector3(ball.position.x*0.5, ball.position.y+camOffset.y, ball.position.z+camOffset.z);
  camera.position.lerp(targetPos, 1-Math.pow(0.001, dt));
  const lookAt = new THREE.Vector3(ball.position.x*0.5, ball.position.y+0.3, ball.position.z-4);
  camera.lookAt(lookAt);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;

  if(state==='playing'){
    updateKeyMove();
    if(boostTimer>0){ boostTimer -= dt; }
    const curSpeed = speed * (boostTimer>0 ? 1.8 : 1) * (1 + Math.min(0.6, distance/600));
    distance += curSpeed*dt;

    ballVX = moveDir*5.5;
    ballX += ballVX*dt;
    ballX = Math.max(-TRACK_HALF_W+BALL_R, Math.min(TRACK_HALF_W-BALL_R, ballX));

    ballVY += GRAVITY*dt;
    ballY += ballVY*dt;
    if(ballY <= BALL_R){ ballY = BALL_R; ballVY = 0; jumping = false; }

    if(invuln>0) invuln -= dt;

    ball.position.set(ballX, ballY, -distance);
    ball.rotation.x -= curSpeed*dt/BALL_R;
    ball.rotation.z = -ballX*0.3;

    const themeN = Math.floor(distance/(TILE_LEN*12));
    if(themeN !== themeIdx){ themeIdx = themeN; }
    scene.background = skyColor((Math.sin(distance*0.02)+1)/2, themeIdx);
    scene.fog.color = scene.background;

    ensureTiles(Math.floor(distance/TILE_LEN));
    handleCollisions(dt);
    updateHud();

    tiles.forEach(t=>{
      if(t.gems) t.gems.forEach(g=>{ if(g.visible) g.rotation.y += dt*3; });
    });
  } else if(state==='falling'){
    ballVY += GRAVITY*dt;
    ballY += ballVY*dt;
    ball.position.set(ballX, ballY, -distance);
    ball.rotation.x -= 4*dt/BALL_R;
  }

  updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// initial menu track (idle preview)
resetRun(false);
state = 'menu';
})();
</script>
</body>
</html>
